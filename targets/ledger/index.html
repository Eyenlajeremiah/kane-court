<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledgerline — Books that close themselves</title>
<link rel="stylesheet" href="/style.css">
<style>
.hero{padding:60px 20px;max-width:640px;margin:0 auto;text-align:center}
h1{font-size:34px;margin:0 0 12px}
.cta{background:#c8a96a;color:#14161b;border:0;padding:14px 26px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
.lede{color:#8b8f9a;font-size:17px}
.panel{display:none;margin-top:22px;border:1px solid #262a33;border-radius:10px;padding:20px;background:#15171d;text-align:left}
.panel.on{display:block}
</style></head><body><div class="wrap">
<div class="hero">
  <h1>Books that close themselves.</h1>
  <p class="lede">Ledgerline reconciles your accounts, categorises every transaction and hands you a monthly report you can actually read.</p>
  <button class="cta" id="cta">Start free trial</button>
  <div class="panel" id="panel">
    <h2 style="margin-top:0">Start your trial</h2>
    <form id="f">
      <label for="n">Full name</label><input id="n" style="width:100%">
      <label for="e">Work email</label><input id="e" type="email" style="width:100%">
      <p><button type="submit">Create account</button></p>
    </form>
  </div>
</div>
</div>
<script>
document.getElementById('cta').addEventListener('click',function(){
  document.getElementById('panel').classList.add('on');
});
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();
  document.getElementById('done').style.display='block';
});
</script>
</body></html>
